<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Spacezero</title>
    <style>
      :root {
        color: #e9f4ff;
        background: radial-gradient(circle at 18% 18%, #1a2d4c 0%, #090f1d 42%, #050912 74%, #03040a 100%);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      body {
        font-family: 'Orbitron', 'Space Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          'Liberation Mono', 'Courier New', monospace;
      }
      body[data-debug-mode='false'] #debug-overlay,
      body[data-debug-mode='false'] #event-overlay,
      body[data-debug-mode='false'] #ai-overlay {
        display: none;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      canvas {
        display: block;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        filter: saturate(1.12) contrast(1.08);
      }
      #debug-overlay {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 8px 10px;
        background: linear-gradient(180deg, rgba(10, 18, 35, 0.72), rgba(6, 11, 24, 0.66));
        border: 1px solid rgba(132, 189, 255, 0.42);
        border-radius: 8px;
        box-shadow: 0 0 22px rgba(48, 130, 218, 0.15);
        backdrop-filter: blur(6px);
        font-size: 12px;
        line-height: 1.4;
        letter-spacing: 0.2px;
        white-space: pre;
        pointer-events: none;
        user-select: none;
        z-index: 12;
      }
      #event-overlay {
        position: absolute;
        top: 140px;
        left: 12px;
        padding: 6px 10px;
        background: rgba(8, 14, 28, 0.58);
        border: 1px solid rgba(135, 196, 255, 0.32);
        border-radius: 7px;
        backdrop-filter: blur(5px);
        font-size: 11px;
        letter-spacing: 0.2px;
        pointer-events: none;
        user-select: none;
        z-index: 12;
      }
      #loading-overlay {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 10px 16px;
        background: rgba(8, 14, 28, 0.82);
        border: 1px solid rgba(143, 203, 255, 0.5);
        border-radius: 10px;
        box-shadow: 0 0 22px rgba(76, 158, 255, 0.24);
        backdrop-filter: blur(6px);
        font-size: 12px;
        letter-spacing: 0.35px;
        pointer-events: none;
        user-select: none;
        z-index: 30;
      }
      #stage-overlay {
        position: absolute;
        top: 220px;
        left: 12px;
        padding: 8px 10px;
        background: rgba(8, 14, 28, 0.62);
        border: 1px solid rgba(138, 197, 255, 0.38);
        border-radius: 8px;
        backdrop-filter: blur(5px);
        box-shadow: 0 0 16px rgba(44, 128, 220, 0.14);
        font-size: 11px;
        letter-spacing: 0.2px;
        pointer-events: auto;
        user-select: none;
        z-index: 20;
      }
      #ai-overlay {
        position: absolute;
        top: 340px;
        left: 12px;
        padding: 6px 10px;
        background: rgba(8, 14, 28, 0.52);
        border: 1px solid rgba(135, 196, 255, 0.32);
        border-radius: 7px;
        backdrop-filter: blur(4px);
        font-size: 11px;
        letter-spacing: 0.2px;
        pointer-events: none;
        user-select: none;
        z-index: 12;
      }
      #hit-marker {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 42px;
        height: 42px;
        border: 1px solid rgba(205, 242, 255, 0.82);
        color: rgba(235, 251, 255, 0.95);
        text-shadow: 0 0 14px rgba(129, 221, 255, 0.85);
        box-shadow: 0 0 20px rgba(129, 221, 255, 0.3), inset 0 0 12px rgba(129, 221, 255, 0.2);
        font-size: 20px;
        line-height: 40px;
        text-align: center;
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
        user-select: none;
        z-index: 15;
        transition: opacity 0.07s ease-out;
      }
      #hit-marker[data-active='true'] {
        opacity: 1;
      }
      #hit-flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 11;
        opacity: 0;
        background:
          radial-gradient(circle at 50% 48%, rgba(130, 214, 255, 0.22) 0%, rgba(130, 214, 255, 0.08) 20%, rgba(130, 214, 255, 0) 58%),
          linear-gradient(180deg, rgba(96, 183, 255, 0.16), rgba(30, 97, 188, 0.02));
      }
      #kill-popup {
        position: absolute;
        left: 50%;
        top: 40%;
        transform: translate(-50%, -15px) scale(1);
        color: #ffe3a9;
        text-shadow: 0 0 12px rgba(255, 190, 90, 0.9), 0 0 22px rgba(255, 130, 40, 0.5);
        font-size: 24px;
        letter-spacing: 2px;
        font-weight: 700;
        opacity: 0;
        pointer-events: none;
        user-select: none;
        z-index: 16;
      }
      #target-bracket {
        position: absolute;
        width: 52px;
        height: 52px;
        border: 2px solid rgba(120, 220, 255, 0.92);
        box-shadow: 0 0 14px rgba(80, 190, 255, 0.65), inset 0 0 12px rgba(70, 150, 255, 0.22);
        border-radius: 8px;
        opacity: 0;
        pointer-events: auto;
        user-select: none;
        transform: translate(-50%, -50%);
        z-index: 14;
      }
      #target-bracket[data-active='true'] {
        opacity: 1;
      }
      #target-bracket[data-active='false'] {
        pointer-events: none;
      }
      .target-distance {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translate(-50%, 8px);
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid rgba(120, 210, 255, 0.72);
        background: rgba(8, 16, 30, 0.76);
        box-shadow: 0 0 10px rgba(66, 151, 255, 0.32);
        font-size: 10px;
        letter-spacing: 0.35px;
        color: #e2f0ff;
        white-space: nowrap;
      }
      #target-arrow {
        position: absolute;
        width: 28px;
        height: 28px;
        border: 2px solid rgba(123, 216, 255, 0.92);
        box-shadow: 0 0 12px rgba(80, 190, 255, 0.58);
        border-left: none;
        border-bottom: none;
        opacity: 0;
        pointer-events: auto;
        user-select: none;
        transform: translate(-50%, -50%) rotate(0rad);
        z-index: 14;
      }
      #target-arrow[data-active='true'] {
        opacity: 1;
      }
      #target-arrow[data-active='false'] {
        pointer-events: none;
      }
      #auto-trace-indicator {
        position: absolute;
        right: 14px;
        top: 148px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(120, 215, 255, 0.72);
        box-shadow: 0 0 14px rgba(88, 198, 255, 0.34);
        background: rgba(8, 16, 31, 0.76);
        color: #d7e8ff;
        font-size: 11px;
        letter-spacing: 0.35px;
        text-transform: uppercase;
        opacity: 0;
        pointer-events: none;
        z-index: 13;
      }
      #auto-trace-indicator[data-active='true'] {
        opacity: 1;
      }
      .stage-label {
        white-space: pre;
        color: #e2f2ff;
        text-shadow: 0 0 10px rgba(98, 182, 255, 0.28);
      }
      .stage-buttons {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }
      .stage-button {
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(120, 184, 255, 0.62);
        background: linear-gradient(180deg, rgba(20, 38, 66, 0.76), rgba(11, 24, 44, 0.72));
        color: #dff0ff;
        box-shadow: 0 0 10px rgba(62, 142, 255, 0.22);
        font-size: 11px;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        touch-action: manipulation;
      }
      #input-overlay {
        position: absolute;
        inset: 0;
        pointer-events: auto;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        z-index: 10;
      }
      .touch-sticks {
        position: absolute;
        inset: 0;
      }
      .stick-area {
        position: absolute;
        width: min(38vw, 190px);
        height: min(38vw, 190px);
        bottom: 16px;
        pointer-events: auto;
      }
      .stick-left {
        left: 16px;
      }
      .stick-right {
        right: 16px;
      }
      .stick-base {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(120, 180, 240, 0.45);
        background: radial-gradient(circle, rgba(62, 95, 150, 0.34), rgba(10, 15, 25, 0.7));
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.42) inset, 0 0 16px rgba(54, 126, 230, 0.18);
      }
      .stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 40%;
        height: 40%;
        margin-left: -20%;
        margin-top: -20%;
        border-radius: 50%;
        border: 1px solid rgba(168, 219, 255, 0.84);
        background: rgba(120, 185, 255, 0.34);
        box-shadow: 0 0 14px rgba(95, 166, 255, 0.68);
        transform: translate(0, 0);
      }
      .button-cluster {
        position: absolute;
        right: 16px;
        bottom: 210px;
        display: grid;
        gap: 10px;
        pointer-events: auto;
      }
      .input-button {
        min-width: 96px;
        padding: 10px 12px;
        border-radius: 999px;
        border: 1px solid rgba(120, 185, 255, 0.6);
        background: linear-gradient(180deg, rgba(20, 38, 66, 0.78), rgba(11, 24, 44, 0.72));
        color: #e0f1ff;
        box-shadow: 0 0 10px rgba(65, 145, 240, 0.2);
        font-size: 12px;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        touch-action: manipulation;
      }
      .input-button[data-active='true'] {
        background: linear-gradient(180deg, rgba(42, 102, 180, 0.9), rgba(22, 63, 125, 0.85));
        border-color: rgba(160, 224, 255, 0.9);
        box-shadow: 0 0 14px rgba(88, 178, 255, 0.45);
      }
      .input-button:disabled {
        opacity: 0.5;
      }
      .env-toggle {
        position: absolute;
        top: 12px;
        right: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(120, 185, 255, 0.62);
        background: rgba(9, 19, 35, 0.64);
        color: #d7e8ff;
        box-shadow: 0 0 12px rgba(51, 133, 228, 0.2);
        font-size: 11px;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        pointer-events: auto;
        touch-action: manipulation;
      }
      .env-toggle[data-active='false'] {
        opacity: 0.5;
      }
      .anchor-toggle {
        top: 44px;
      }
      .band-toggle {
        top: 76px;
      }
      .sun-toggle {
        top: 108px;
      }
      @media (min-width: 900px) {
        .button-cluster {
          right: 24px;
          bottom: 260px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
